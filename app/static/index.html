<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Closet</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Today</h1>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <main>
    <!-- TODAY -->
    <section id="view-today" class="view">
      <div id="weather-card" class="card weather"></div>
      <div class="controls">
        <div class="seg" id="occasion-seg" role="group" aria-label="Occasion">
          <button data-v="1">Casual</button>
          <button data-v="2" class="on">Smart casual</button>
          <button data-v="3">Formal</button>
        </div>
        <div class="seg" id="day-seg" role="group" aria-label="Day">
          <button data-v="0" class="on">Today</button>
          <button data-v="1">Tomorrow</button>
        </div>
      </div>
      <div id="suggestions"></div>
      <button id="shuffle-btn" class="btn ghost wide">Show different outfits</button>
    </section>

    <!-- CLOSET -->
    <section id="view-closet" class="view" hidden>
      <div class="closet-tools">
        <input id="search" type="search" placeholder="Search name, color, brand, tag" autocomplete="off">
        <button id="add-item-btn" class="btn primary">Add item</button>
      </div>
      <div class="chips" id="cat-chips"></div>
      <div id="laundry-bar" class="laundry-bar" hidden></div>
      <div id="closet-grid" class="grid"></div>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="view" hidden>
      <button id="log-outfit-btn" class="btn primary wide">Log what I wore</button>
      <div id="history-list"></div>
    </section>

    <!-- OUTFITS -->
    <section id="view-outfits" class="view" hidden>
      <div id="ai-create" class="card ai-box" hidden>
        <div><strong>Create outfits with AI</strong>
          <div class="muted small">Builds new outfits from your clean clothes. Optionally say what they're for.</div></div>
        <div class="inline">
          <input id="ai-note" maxlength="300" placeholder="e.g. work week, beach trip" autocomplete="off">
          <button class="btn primary" id="ai-create-btn">Create</button>
        </div>
      </div>
      <div id="ai-results" class="ai-results"></div>
      <div id="saved-list" class="saved-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="today" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Today
    </button>
    <button data-view="closet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3L3 13.6A1.5 1.5 0 0 0 3.9 16.4h16.2a1.5 1.5 0 0 0 .9-2.8L12 7.5"/></svg>
      Closet
    </button>
    <button data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      History
    </button>
    <button data-view="outfits" id="outfits-tab" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      Outfits
    </button>
  </nav>

  <!-- ITEM EDITOR -->
  <dialog id="item-dialog">
    <form id="item-form" method="dialog">
      <div class="dlg-head">
        <h2 id="item-dialog-title">Add item</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-body">
        <label class="photo-pick">
          <input type="file" name="photo" accept="image/*" hidden>
          <div id="photo-preview" class="photo-preview"><span>Add photo</span></div>
        </label>
        <button type="button" id="remove-photo-btn" class="link-btn" hidden>Remove photo</button>
        <button type="button" id="ai-fill-btn" class="btn ai-fill" hidden>✨ Fill in with AI</button>

        <label class="field">Name
          <input name="name" required maxlength="120" placeholder="e.g. Navy oxford shirt">
        </label>
        <div class="row2">
          <label class="field">Category
            <select name="category" required></select>
          </label>
          <label class="field">Main color
            <input name="color" list="color-list" maxlength="40" placeholder="e.g. navy">
          </label>
        </div>
        <label class="field"><span>Warmth: <strong id="warmth-label">Medium</strong></span>
          <input type="range" name="warmth" min="1" max="5" step="1" value="3">
        </label>
        <div class="field">Formality
          <div class="seg" id="formality-seg">
            <button type="button" data-v="1">Casual</button>
            <button type="button" data-v="2" class="on">Smart casual</button>
            <button type="button" data-v="3">Formal</button>
          </div>
        </div>
        <label class="field">Brand
          <input name="brand" maxlength="80">
        </label>
        <label class="field"><span>Tags <span class="small">(comma separated; “waterproof” helps on rainy days)</span></span>
          <input name="tags" maxlength="200" placeholder="work, summer, waterproof">
        </label>
        <label class="field">Notes
          <textarea name="notes" rows="2" maxlength="1000"></textarea>
        </label>
        <label class="check"><input type="checkbox" name="favorite"> Favorite</label>
        <button type="button" id="build-btn" class="btn ghost wide" hidden>✨ Build outfits with this</button>
      </div>
      <div class="dlg-foot">
        <div class="dlg-foot-left" id="item-extra-actions" hidden>
          <button type="button" class="btn ghost" id="archive-btn">Archive</button>
          <button type="button" class="btn danger-ghost" id="delete-btn">Delete</button>
        </div>
        <button type="submit" class="btn primary" id="item-save-btn">Save</button>
      </div>
    </form>
  </dialog>
  <datalist id="color-list">
    <option value="black"><option value="white"><option value="grey"><option value="navy">
    <option value="beige"><option value="cream"><option value="brown"><option value="tan">
    <option value="denim"><option value="khaki"><option value="olive"><option value="green">
    <option value="blue"><option value="light blue"><option value="red"><option value="burgundy">
    <option value="pink"><option value="purple"><option value="yellow"><option value="mustard">
    <option value="orange"><option value="rust"><option value="teal"><option value="patterned">
  </datalist>

  <!-- LOG OUTFIT -->
  <dialog id="log-dialog">
    <form id="log-form" method="dialog">
      <div class="dlg-head">
        <h2>Log an outfit</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-body">
        <div class="row2">
          <label class="field">Date
            <input type="date" name="worn_on" required>
          </label>
          <label class="field">Occasion
            <select name="occasion">
              <option value="1">Casual</option>
              <option value="2" selected>Smart casual</option>
              <option value="3">Formal</option>
            </select>
          </label>
        </div>
        <div class="field">How did it feel?
          <div class="stars" id="log-stars"></div>
        </div>
        <p class="muted small" id="pick-count">Tap the pieces you wore.</p>
        <div id="picker" class="picker"></div>
      </div>
      <div class="dlg-foot">
        <span></span>
        <button type="submit" class="btn primary">Save outfit</button>
      </div>
    </form>
  </dialog>

  <!-- SETTINGS -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="dlg-head">
        <h2>Settings</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="dlg-body">
        <div class="field">Location
          <div class="muted small" id="current-location">Not set</div>
          <div class="inline">
            <input id="loc-query" placeholder="Search a city" autocomplete="off">
            <button type="button" class="btn" id="loc-search-btn">Search</button>
          </div>
          <div id="loc-results" class="loc-results"></div>
        </div>
        <div class="field">Temperature unit
          <div class="seg" id="unit-seg">
            <button type="button" data-v="C">°C</button>
            <button type="button" data-v="F">°F</button>
          </div>
        </div>
        <label class="field"><span>Add a jacket when it feels colder than (<span id="thresh-unit">°C</span>)</span>
          <input type="number" name="outerwear_below" step="1">
        </label>
        <label class="field" id="ai-prompt-field" hidden><span>Outfit instructions for AI <span class="small">(used when the AI creates outfits)</span></span>
          <textarea name="ai_prompt" rows="4" maxlength="1000" placeholder="e.g. I prefer minimal looks, no shorts for work, I like navy with brown."></textarea>
        </label>
      </div>
      <div class="dlg-foot">
        <span></span>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
